<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet 17th Birthday Party - Natasha Aurelia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --violet: #2E0854;
      --pink: #E01A7E;
      --gold: #FFE6A7;
      --dark: #120324;
      --shadow: 0 10px 30px rgba(224, 26, 126, 0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: var(--dark); color: #FFF; line-height: 1.6; }
    h1, h2, h3, .cover-title { font-family: 'Fredoka', cursive; color: var(--pink); }
    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    .text-center { text-align: center; }

    /* COVER BIRTHDAY */
    .cover-section {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #4A0E4E 0%, #120324 100%);
      color: #FFF; display: flex; justify-content: center; align-items: center; z-index: 999;
      transition: transform 0.8s ease; padding: 20px; text-align: center;
    }
    .cover-section.hide { transform: translateY(-100%); pointer-events: none; }
    .cover-card {
      border: 2px solid var(--pink); padding: 40px 25px; border-radius: 30px; max-width: 440px;
      background: rgba(18, 3, 36, 0.92); box-shadow: 0 20px 60px rgba(224, 26, 126, 0.4);
    }
    .btn-buka {
      background: linear-gradient(135deg, var(--pink) 0%, #9C1156 100%);
      color: #FFF; border: none; padding: 12px 32px; font-size: 14px; font-weight: 800;
      border-radius: 30px; cursor: pointer; margin-top: 20px; box-shadow: var(--shadow);
    }

    /* MAIN */
    .main-content { display: none; opacity: 0; transition: opacity 0.6s ease; padding-bottom: 70px; }
    .main-content.show { display: block; opacity: 1; }
    section { padding: 60px 0; text-align: center; }

    .party-badge { background: var(--pink); color: #FFF; padding: 5px 18px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 2px; }

    .music-toggle { position: fixed; bottom: 25px; left: 25px; width: 45px; height: 45px; background: var(--pink); color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 998; cursor: pointer; }
  </style>
</head>
<body>
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=party-pop-dance-10943.mp3" type="audio/mp3">
  </audio>

  <div class="music-toggle" id="musicToggle" onclick="toggleMusic()" style="display:none;">
    <i class="fas fa-glass-cheers"></i>
  </div>

  <div class="cover-section" id="cover">
    <div class="cover-card">
      <i class="fas fa-birthday-cake" style="font-size:40px; color:var(--pink); margin-bottom:10px;"></i>
      <p style="font-size:12px; letter-spacing:4px; color:var(--gold); font-weight:700;">SWEET SEVENTEEN</p>
      <h1 class="cover-title" style="font-size:36px; margin:8px 0;">Natasha Aurelia</h1>
      <p style="font-size:13px; color:#D8B4F8;">Saturday Night, 19 Dec 2026</p>
      <div style="margin:20px 0; padding:12px; background:rgba(255,255,255,0.05); border:1px dashed var(--pink); border-radius:12px;">
        <p style="font-size:11px; color:#BBB;">VIP Guest Invitation:</p>
        <h3 style="font-size:18px; color:var(--gold);" id="namaTamuCover">Party Guest</h3>
      </div>
      <button class="btn-buka" onclick="bukaUndangan()">Open Party Pass</button>
    </div>
  </div>

  <main class="main-content" id="mainContent">
    <section>
      <div class="container">
        <span class="party-badge">NEON GLAMOUR PARTY</span>
        <h2 style="font-size:32px; margin:15px 0 8px;">Turning 17 &amp; Fabulous!</h2>
        <p style="max-width:540px; margin:0 auto; font-size:14px; color:#D8B4F8;">
          "Get ready for a night of music, dance, memories, and celebration! Dress to impress in Neon Chic / Glamour."
        </p>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('namaTamuCover').textContent = urlParams.get('to') || 'Party Guest';
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;
    function bukaUndangan() {
      document.getElementById('cover').classList.add('hide');
      document.getElementById('mainContent').classList.add('show');
      musicToggle.style.display = 'flex';
      bgMusic.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleMusic() {
      if (isPlaying) { bgMusic.pause(); isPlaying = false; }
      else { bgMusic.play(); isPlaying = true; }
    }
  </script>
</body>
</html>
