<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Aqiqah - Kalandra Zayn Arsakha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --sage: #7A9E7E;
      --peach: #F6C8B2;
      --bg: #FAF9F6;
      --shadow: 0 10px 25px rgba(122, 158, 126, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: #333; line-height: 1.6; }
    h1, h2, h3, .cover-title { font-family: 'Fredoka', cursive; color: var(--sage); }
    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    .text-center { text-align: center; }

    /* COVER AQIQAH */
    .cover-section {
      position: fixed; inset: 0; background: linear-gradient(135deg, #7A9E7E 0%, #F6C8B2 100%);
      color: #FFF; display: flex; justify-content: center; align-items: center; z-index: 999;
      transition: transform 0.8s ease; padding: 20px; text-align: center;
    }
    .cover-section.hide { transform: translateY(-100%); pointer-events: none; }
    .cover-card {
      background: #FFF; color: #333; padding: 40px 25px; border-radius: 30px; max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 3px solid var(--peach);
    }
    .btn-buka {
      background: var(--sage); color: #FFF; border: none; padding: 12px 32px;
      font-size: 14px; font-weight: 700; border-radius: 30px; cursor: pointer; margin-top: 20px;
    }

    /* MAIN */
    .main-content { display: none; opacity: 0; transition: opacity 0.6s ease; padding-bottom: 70px; }
    .main-content.show { display: block; opacity: 1; }
    section { padding: 60px 0; text-align: center; }

    /* STATS BADGES */
    .stat-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 25px 0; }
    .stat-badge { background: #FFF; border: 1.5px solid var(--sage); padding: 12px 18px; border-radius: 16px; }

    .music-toggle { position: fixed; bottom: 25px; left: 25px; width: 45px; height: 45px; background: var(--sage); color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 998; cursor: pointer; }
  </style>
</head>
<body>
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=traditional-asian-melody-113337.mp3" type="audio/mp3">
  </audio>

  <div class="music-toggle" id="musicToggle" onclick="toggleMusic()" style="display:none;">
    <i class="fas fa-baby"></i>
  </div>

  <div class="cover-section" id="cover">
    <div class="cover-card">
      <i class="fas fa-baby-carriage" style="font-size:40px; color:var(--sage); margin-bottom:10px;"></i>
      <p style="font-size:12px; letter-spacing:2px; color:var(--sage); font-weight:700;">TASYAKURAN AQIQAH</p>
      <h1 class="cover-title" style="font-size:32px; margin:8px 0;">Kalandra Zayn</h1>
      <p style="font-size:13px; color:#777;">Sabtu, 5 Desember 2026</p>
      <div style="margin:20px 0; padding:12px; background:#FAF9F6; border:1px dashed var(--sage); border-radius:12px;">
        <p style="font-size:11px; color:#888;">Kepada Yth:</p>
        <h3 style="font-size:18px; color:var(--sage);" id="namaTamuCover">Tamu Undangan</h3>
      </div>
      <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
    </div>
  </div>

  <main class="main-content" id="mainContent">
    <section>
      <div class="container">
        <span style="background:var(--sage); color:#FFF; padding:5px 16px; border-radius:20px; font-size:11px; font-weight:700;">Alhamdulillah Telah Lahir</span>
        <h2 style="font-size:28px; margin:15px 0 8px;">Kalandra Zayn Arsakha</h2>
        <p style="font-style:italic; max-width:540px; margin:0 auto; font-size:13px; color:#666;">
          "Semoga menjadi anak yang sholeh, cerdas, berakhlak mulia, serta menjadi penyejuk hati bagi kedua orang tua."
        </p>

        <div class="stat-grid">
          <div class="stat-badge"><i class="far fa-calendar-alt"></i> Lahir: 15 Nov 2026</div>
          <div class="stat-badge"><i class="fas fa-weight"></i> Berat: 3.4 Kg</div>
          <div class="stat-badge"><i class="fas fa-ruler-vertical"></i> Panjang: 50 Cm</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('namaTamuCover').textContent = urlParams.get('to') || 'Tamu Undangan';
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;
    function bukaUndangan() {
      document.getElementById('cover').classList.add('hide');
      document.getElementById('mainContent').classList.add('show');
      musicToggle.style.display = 'flex';
      bgMusic.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleMusic() {
      if (isPlaying) { bgMusic.pause(); isPlaying = false; }
      else { bgMusic.play(); isPlaying = true; }
    }
  </script>
</body>
</html>
