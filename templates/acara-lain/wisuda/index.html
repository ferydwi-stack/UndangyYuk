<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasyakuran Kelulusan &amp; Wisuda - Kevin Pratama, S.Kom.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --navy: #0F254A;
      --gold: #C89B3C;
      --bg: #F8F9FA;
      --shadow: 0 10px 30px rgba(15, 37, 74, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: #222; line-height: 1.6; }
    h1, h2, h3, .cover-title { font-family: 'Cinzel', serif; color: var(--navy); }
    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    .text-center { text-align: center; }

    /* COVER WISUDA */
    .cover-section {
      position: fixed; inset: 0; background: linear-gradient(135deg, #071224 0%, #0F254A 50%, #030812 100%);
      color: #FFF; display: flex; justify-content: center; align-items: center; z-index: 999;
      transition: transform 0.8s ease; padding: 20px; text-align: center;
    }
    .cover-section.hide { transform: translateY(-100%); pointer-events: none; }
    .cover-card {
      border: 2px solid var(--gold); padding: 40px 25px; border-radius: 20px; max-width: 460px;
      background: rgba(7, 18, 36, 0.94); box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .btn-buka {
      background: var(--gold); color: #0F254A; border: none; padding: 12px 32px;
      font-size: 14px; font-weight: 800; border-radius: 30px; cursor: pointer; margin-top: 20px;
    }

    /* MAIN */
    .main-content { display: none; opacity: 0; transition: opacity 0.6s ease; padding-bottom: 70px; }
    .main-content.show { display: block; opacity: 1; }
    section { padding: 60px 0; text-align: center; }

    .music-toggle { position: fixed; bottom: 25px; left: 25px; width: 45px; height: 45px; background: var(--navy); color: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 998; cursor: pointer; border: 2px solid var(--gold); }
  </style>
</head>
<body>
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=traditional-asian-melody-113337.mp3" type="audio/mp3">
  </audio>

  <div class="music-toggle" id="musicToggle" onclick="toggleMusic()" style="display:none;">
    <i class="fas fa-graduation-cap"></i>
  </div>

  <div class="cover-section" id="cover">
    <div class="cover-card">
      <i class="fas fa-user-graduate" style="font-size:40px; color:var(--gold); margin-bottom:10px;"></i>
      <p style="font-size:12px; letter-spacing:4px; color:var(--gold); font-weight:700;">TASYAKURAN KELULUSAN &amp; WISUDA</p>
      <h1 class="cover-title" style="color:#FFF; font-size:30px; margin:10px 0;">Kevin Pratama, S.Kom.</h1>
      <p style="font-size:13px; color:#B0C8E8;">Sabtu, 28 November 2026</p>
      <div style="margin:20px 0; padding:12px; background:rgba(0,0,0,0.5); border:1px dashed var(--gold); border-radius:12px;">
        <p style="font-size:11px; color:#DDD;">Undangan Khusus Kpd Yth:</p>
        <h3 style="font-size:18px; color:var(--gold);" id="namaTamuCover">Tamu Undangan</h3>
      </div>
      <button class="btn-buka" onclick="bukaUndangan()"><i class="fas fa-envelope-open"></i> Buka Undangan</button>
    </div>
  </div>

  <main class="main-content" id="mainContent">
    <section>
      <div class="container">
        <span style="background:var(--navy); color:var(--gold); padding:5px 16px; border-radius:20px; font-size:11px; font-weight:700;">GRADUATION DAY &bull; CUM LAUDE</span>
        <h2 style="font-size:28px; margin:15px 0 8px;">Sarjana Ilmu Komputer</h2>
        <p style="font-style:italic; max-width:540px; margin:0 auto; font-size:14px; color:#555;">
          "Rasa syukur kami panjatkan atas kelulusan putra kami tercinta. Terima kasih atas segala bimbingan dan doa restunya."
        </p>
      </div>
    </section>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('namaTamuCover').textContent = urlParams.get('to') || 'Tamu Undangan';
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;
    function bukaUndangan() {
      document.getElementById('cover').classList.add('hide');
      document.getElementById('mainContent').classList.add('show');
      musicToggle.style.display = 'flex';
      bgMusic.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleMusic() {
      if (isPlaying) { bgMusic.pause(); isPlaying = false; }
      else { bgMusic.play(); isPlaying = true; }
    }
  </script>
</body>
</html>
